name: Build Kim Android

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kim-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view kim-latest >/dev/null 2>&1 || gh release create kim-latest --title "Kim latest Android APK" --notes "Debug APK build from the latest main commit." --prerelease
          gh release upload kim-latest app/build/outputs/apk/debug/app-debug.apk --clobber
